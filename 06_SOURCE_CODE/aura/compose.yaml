# AURA local development environment
#
# The API is stateless by default (in-memory stores) so a single service
# runs standalone. Persistent backing services (PostgreSQL/Redis) are
# deliberately not required yet — see docs/ for the persistence roadmap.

services:
  aura-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura:0.2.0
    environment:
      AURA_ENVIRONMENT: development
      AURA_INSTANCE_ID: compose-dev
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped