[project]
name = "aura-sdk"
version = "1.0.0"
description = "Developer SDK for the AURA integrated reasoning platform (canonical runtime client)"
authors = [{ name = "AURA Project" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[project.dependencies]
aura = ">=0.2.0"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["aura_sdk*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "../aura/src"]

[tool.mypy]
python_version = "3.11"
strict = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["aura_sdk", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
