[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-reflection"
version = "0.2.0"
description = "Reflective intelligence subsystem for AURA"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["Tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
