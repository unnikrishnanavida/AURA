[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-cli"
version = "0.2.0"
description = "AURA command-line interface (real operations, stable exit codes)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aura = "aura_cli.__main__:main"
